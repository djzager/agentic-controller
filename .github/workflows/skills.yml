name: Validate and Build Skills

# PR-time validation and build check for the skill bundle. The versioned
# build+push lives in image-build-push.yml (filter-free so tag pushes fire).

on:
  pull_request:
  workflow_dispatch: {}

permissions: {}

jobs:
  validate-and-build:
    permissions:
      contents: read
    name: Validate and build the skill bundle
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Frontmatter is the only skill metadata, and it is what the agent
      # runtime uses to decide whether to read a skill at all. Catch an
      # unusable one here rather than at pod init.
      - name: Validate skill frontmatter
        run: make skill-validate

      - name: Build skill bundle
        run: make skill-build
